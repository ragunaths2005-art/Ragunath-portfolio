<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Weather Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
display:flex;
justify-content:center;
padding:30px;
color:#fff;
}

.container{
width:100%;
max-width:1200px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.logo{
font-size:28px;
font-weight:700;
}

.search-box{
display:flex;
gap:10px;
}

.search-box input{
padding:12px;
border:none;
outline:none;
border-radius:12px;
width:250px;
}

.search-box button{
padding:12px 20px;
border:none;
border-radius:12px;
cursor:pointer;
background:#4f46e5;
color:white;
font-weight:600;
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
}

.main-card{
border-radius:25px;
padding:30px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.temp{
font-size:80px;
font-weight:700;
}

.city{
font-size:35px;
font-weight:600;
}

.condition{
font-size:18px;
opacity:.8;
}

.weather-icon{
width:120px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
padding:25px;
border-radius:20px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card h3{
margin-bottom:10px;
font-size:16px;
}

.card p{
font-size:28px;
font-weight:600;
}

.forecast-title{
margin-bottom:15px;
}

.forecast{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.forecast-card{
padding:20px;
border-radius:18px;
text-align:center;
}

.forecast-card:hover{
transform:translateY(-5px);
transition:.3s;
}

.forecast-card img{
width:60px;
}

.footer{
margin-top:25px;
text-align:center;
opacity:.7;
}

@media(max-width:768px){

.main-card{
flex-direction:column;
text-align:center;
gap:20px;
}

.temp{
font-size:60px;
}

.city{
font-size:28px;
}

.search-box{
width:100%;
}

.search-box input{
width:100%;
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="logo">🌦 Weather Dashboard</div>

<div class="search-box">
<input type="text" id="cityInput" placeholder="Enter City Name">
<button onclick="getWeather()">Search</button>
</div>

</div>

<div class="main-card glass">

<div>
<h2 class="city" id="city">Chennai</h2>
<h1 class="temp" id="temp">32°C</h1>
<p class="condition" id="condition">Clear Sky</p>
</div>

<div>
<img class="weather-icon" id="icon"
src="https://openweathermap.org/img/wn/01d@4x.png">
</div>

</div>

<div class="stats">

<div class="card glass">
<h3>Humidity</h3>
<p id="humidity">68%</p>
</div>

<div class="card glass">
<h3>Wind Speed</h3>
<p id="wind">12 km/h</p>
</div>

<div class="card glass">
<h3>Pressure</h3>
<p id="pressure">1012</p>
</div>

<div class="card glass">
<h3>Feels Like</h3>
<p id="feels">35°C</p>
</div>

</div>

<h2 class="forecast-title">5 Day Forecast</h2>

<div class="forecast">

<div class="forecast-card glass">
<h3>Mon</h3>
<img src="https://openweathermap.org/img/wn/01d@2x.png">
<p>34°C</p>
</div>

<div class="forecast-card glass">
<h3>Tue</h3>
<img src="https://openweathermap.org/img/wn/02d@2x.png">
<p>32°C</p>
</div>

<div class="forecast-card glass">
<h3>Wed</h3>
<img src="https://openweathermap.org/img/wn/10d@2x.png">
<p>29°C</p>
</div>

<div class="forecast-card glass">
<h3>Thu</h3>
<img src="https://openweathermap.org/img/wn/03d@2x.png">
<p>31°C</p>
</div>

<div class="forecast-card glass">
<h3>Fri</h3>
<img src="https://openweathermap.org/img/wn/01d@2x.png">
<p>35°C</p>
</div>

</div>

<div class="footer">
Premium Glassmorphism Weather Dashboard
</div>

</div>

<script>

const API_KEY = "YOUR_OPENWEATHER_API_KEY";

async function getWeather(){

const city =
document.getElementById("cityInput").value;

if(city===""){
alert("Enter City Name");
return;
}

try{

const response =
await fetch(
`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
);

const data = await response.json();

document.getElementById("city").innerText =
`${data.name}, ${data.sys.country}`;

document.getElementById("temp").innerText =
Math.round(data.main.temp)+"°C";

document.getElementById("condition").innerText =
data.weather[0].description;

document.getElementById("humidity").innerText =
data.main.humidity+"%";

document.getElementById("wind").innerText =
data.wind.speed+" km/h";

document.getElementById("pressure").innerText =
data.main.pressure;

document.getElementById("feels").innerText =
Math.round(data.main.feels_like)+"°C";

document.getElementById("icon").src =
`https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;

}
catch(error){
alert("City Not Found");
}

}

</script>

</body>
</html>
